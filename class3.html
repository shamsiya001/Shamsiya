<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /*css*/
        /*selectors*/
        div{
            color:blue;
        }
        .title1{color:red;
            font-size: 10px;
            font-size: 1.7rem;
            /*font case*/
            text-transform: lowercase;
            text-transform: capitalize;
            text-transform: uppercase;

            /*text-align*/
            text-align: left;
            text-align: center;
            text-align: right;

            /*text-decoration*/
            text-decoration: underline;
            text-decoration: line-through;
            text-decoration: overline;
            text-decoration: none;

            /*font weight*/
            font-weight: 100;
            font-weight: 900;
            font-weight: bold;
            font-weight: lighter;

            letter-spacing: 20px;
            letter-spacing: normal;
            word-spacing: 10px;
            word-spacing: normal;
            line-height: 60px;
            line-height: normal;

            font-family: Arial, Helvetica, sans-serif;

        }
        .solomon{
            color:purple;
            color: rgb(3,7,200);
            color: #ae4;
            color: #293c19;

            padding: 40px;
            background: #090;
            background: linear-gradient(red,#000,red,#000,#990);
            background: radial-gradient(red,#000,red,#000,#990);
            background: conic-gradient(red,#000,red,#000,#990);

            /* */

            background-image: url(pic2.jpg);
            background-size: cover; 
            background-position: top;

        }
        .demo{
            background:orange;
        }
        #demo{
            background: red;
        }
        #demo1{
            background: yellow;
        }
        .list1{
            color:orangered;
        }
        .list2{
            color:chartreuse;
        }
        .sham a{
            color: aqua;
        }
        div div div div{
            font-size: 50px;
        }



    </style>
</head>
<body>
    <!-- introduction to css -->
     <p style="color:red">lorem, ipsum dolor.</p>

     <!-- internal css -->
      <div>lorem, ipsum.</div>
      <div>lorem, ipsum.</div>
      <!-- class -->
      <h1 class="title1"> lorem, ipsum.</h1>
      <h1 class="solomon"> lorem, ipsum.</h1>
      <h1 class="demo"> lorem, ipsum. </h1>
      <h1 class="demo solomon">lorem, ipsum.</h1>

      <!-- id -->
       <div id="demo"> lorem, ipsum dolor.</div>
       <div id="demo1"> Lorem ipsum dolor sit amet, consectetur adipisicing.</div>

       <ul class="list1">
        <li>item 1</li>
        <li>item 2</li>
       </ul>

       <ul class="list2">
        <li>item 1</li>
        <li>item 2</li>

       <div>sham
