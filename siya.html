<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* ================================
   LOGIN PAGE - MODERN DESIGN
================================ */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: "Poppins", Arial, sans-serif;
    background:
        linear-gradient(135deg, rgba(20, 20, 50, 0.85), rgba(85, 45, 130, 0.8)),
        url("background.jpg") center/cover no-repeat;
    overflow: hidden;
}

/* Decorative background circles */
body::before,
body::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    filter: blur(2px);
    z-index: -1;
}

body::before {
    width: 300px;
    height: 300px;
    background: rgba(155, 89, 255, 0.35);
    top: -100px;
    left: -80px;
}

body::after {
    width: 350px;
    height: 350px;
    background: rgba(0, 200, 255, 0.25);
    bottom: -150px;
    right: -100px;
}

/* ================================
   LOGIN CONTAINER
================================ */

.login-container {
    width: 400px;
    padding: 45px 40px;
    background: rgba(255, 255, 255, 0.12);
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 25px;
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    box-shadow:
        0 25px 50px rgba(0, 0, 0, 0.35),
        inset 0 1px 1px rgba(255, 255, 255, 0.2);
    animation: slideUp 0.8s ease;
}

/* ================================
   TITLE
================================ */

.login-container h1 {
    text-align: center;
    color: white;
    font-size: 32px;
    margin-bottom: 8px;
    letter-spacing: 1px;
}

.login-container p {
    text-align: center;
    color: rgba(255, 255, 255, 0.75);
    font-size: 14px;
    margin-bottom: 30px;
}

/* ================================
   INPUT BOX
================================ */

.input-box {
    position: relative;
    margin-bottom: 22px;
}

.input-box input {
    width: 100%;
    height: 55px;
    padding: 0 18px;
    border: none;
    outline: none;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.14);
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: white;
    font-size: 15px;
    transition: 0.3s ease;
}

.input-box input::placeholder {
    color: rgba(255, 255, 255, 0.65);
}

.input-box input:focus {
    border-color: #b36cff;
    background: rgba(255, 255, 255, 0.2);
    box-shadow: 0 0 15px rgba(179, 108, 255, 0.4);
}

/* ================================
   OPTIONS
================================ */

.options {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 5px 0 25px;
    color: white;
    font-size: 13px;
}

.options label {
    display: flex;
    align-items: center;
    gap: 7px;
}

.options input[type="checkbox"] {
    accent-color: #a855f7;
}

.options a {
    color: #d8b4fe;
    text-decoration: none;
    transition: 0.3s;
}

.options a:hover {
    color: white;
}

/* ================================
   LOGIN BUTTON
================================ */

.login-btn {
    width: 100%;
    height: 55px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #8b5cf6, #c026d3);
    color: white;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 10px 25px rgba(139, 92, 246, 0.35);
}

.login-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 15px 30px rgba(139, 92, 246, 0.5);
}

.login-btn:active {
    transform: translateY(0);
}

/* ================================
   REGISTER TEXT
================================ */

.register {
    text-align: center;
    margin-top: 25px;
    color: rgba(255, 255, 255, 0.75);
    font-size: 14px;
}

.register a {
    color: #d8b4fe;
    font-weight: 600;
    text-decoration: none;
}

.register a:hover {
    color: white;
    text-decoration: underline;
}

/* ================================
   ANIMATION
================================ */

@keyframes slideUp {
    from {
        opacity: 0;
        transform: translateY(40px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* ================================
   MOBILE RESPONSIVENESS
================================ */

@media (max-width: 500px) {

    .login-container {
        width: 90%;
        padding: 35px 25px;
    }

    .login-container h1 {
        font-size: 27px;
    }
}
    </style>
</head>
<body>
  <div class="login-container">
        <h1>WELCOME</h1>
        <P>login to continue to your account</P>

    <form action="">
        <div class="input-box">
        <label for=""> EMAIL OR USERNAME</label>
        <input type="text" placeholder="example@Email.com" id="usrname" required>

        <label for="passk">PASSWORD</label>
        <input type="password" placeholder="**********"required >
        </div>

        <div class="options">
        <p> <a href="password-rest.html"> recover password</a> </p>
        </div>
        <button type="submit">SUBMIT</button>

        <div class="create">
        <a href="">Create Account</a>
        </div>
        </div>

        <div class="footer">
            <h2>bridal towers</h2>
            <p>Lorem ipsum dolor sit.</p>
        </div>
    </div>

        
    </form>

</body>
</html>
