<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .demo{
            background: orange;
            padding-top: 50px;
            padding: 40px 10px;
            padding: 0px 10px 40px 100px;
            padding: 30px;


            margin: 30px;
            margin-left: 50px;
            margin: 50px 10px;
            
            width: 100px;
            height: 100px;

        }
        .demo1{
            padding: 0;
            border-radius: 8px;
            border-radius: 8px 30px;
            border-radius: 0px 10px 30px 100px;
            border-radius: 30px 30px 0px 0px;
            border-radius: 50%;
            
        }
        form{
            border-radius: 4px;
            padding: 20px;
            width: 400px;
            margin: 30px auto;
        }
        input{
            border: 2px solid #090;
            margin: 0;
            display: block;
            padding: 10px 18px;
            outline: 0;
        }
        input[type='text']{
            border-radius: 20px 20px 0 0;
            border-bottom: 1px solid #090;
        }
        input[type='password']{
            border-top: 1px solid #090;
            border-radius: 0px 0px 20px 20px;
        }
        .demo2{
            padding: 30px;
            border: 2px dotted orange;
            border: 20px inset orange;
            border: 20px ridge orange;
            border: 20px double orange;
            border-top: 10px inset orange;
            border-bottom-color: black;
            border-radius: 20px;
        }
    </style>
</head>
<body>
    <div class="demo"> lorem Lorem ipsum dolor sit amet consectetur.</div>
    <div class="demo demo1"> Lorem, ipsum.</div>
    <div class="demo2"> Lorem, ipsum dolor.</div>

    <!--  -->
    <form action="">
        <input type="text">
        <input type="password" name="" id="">
    </form>
    
</body>
</html>
