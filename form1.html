<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
       *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            
        } 
        body{
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "poppins", Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #141E30, #243b55, #6a11cb, #2575fc);
            background-size: 400% 400%;
            overflow: hidden;
        }
        body::before
        body::after{
            content: "";
            position: absolute;
            border-radius: 50%;
            filter: blur(2px);
            z-index: -1;
        }
        body::before{
            width: 300px;
            height: 300px;
            background: rgba(0, 200, 255, 0.35);
            bottom: -100px;
            right: -80px;
        }
        body::after{
            width: 350px;
            height: 350px;
            background: rgba(0, 200, 255, 0.25);
            bottom: -150px;
            right: -100px;
        }
        .login-container{
            width: 400px;
            padding: 45px 40px;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 200, 255, 0.25);
            border-radius: 25px;
            backdrop-filter: blur(18px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.35), inset 0 1px 1px rgba(255, 255, 255, 0.2);
            animation: slideUp 0.8s ease;
        }
        .login-container h1{
            text-align: center;
            color: white;
            font-size: 32px;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        .login-container p{
            text-align: center;
            color: rgba(255, 255, 255, 0.75);
            font-size: 14px;
            margin-bottom: 30px;
        }
        .input-box{
            position: relative;
            margin-bottom: 22px;
        }
        .input-box input{
            width: 100%;
            height: 55px;
            padding: 0 18px;
            border: none;
            outline: none;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.14);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;font-size: 15px;
            transition: 0.3 ease;
        }
        .input-box input::placeholder{
            color: rgba(255, 255, 255, 0.65);
        }
        .input-box input:focus{
            border-color: #b36cff;
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 15px rgba(179, 108, 255, 0.4);
        }
        .pass{
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 5px 0 25px;
            color: white;
            font-size: 13px;

        }
        .pass a{
            color: #d8b4fe;
            text-decoration: none;
            margin-bottom: 15px;
            transition: 0.3s;
        }
        button{
            width: 100%;
            height: 55px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #8b5cf6, #c026d3);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(13, 92, 264, 0.35);
            margin-bottom: 15px;

        }
        .create{
            text-align: center;
            margin-bottom: 15px;
            

        }
        .footer{
           background: rgba( #8b5cf6);
           color: white;
           text-align: center;
           padding: 5px;
           font-size: 10px;
        }

    
    </style>
</head>
<body>
    <div class="login-container">
        <h1>WELCOME BACK!!</h1>
        <P>login to continue to your account</P>

    <form action="">
        <div class="input-box">
        <label for=""> EMAIL OR USERNAME</label>
        <input type="text" placeholder="example@Email.com" id="usrname" required>

        <label for="passk">PASSWORD</label>
        <input type="password" placeholder="**********"required >
        </div>

        <p class="pass">
             <a href="password-rest.html"> recover password</a> </p>
       <button type="submit">SUBMIT</button>
       <div class="create">
        <a href="">Create Account</a>
        </div>

        
        <div class="footer">
            <h2>bridal towers</h2>
            <p>Shop Extensively</p>
        </div>
    </div>

        
    </form>

</body>
</html>
